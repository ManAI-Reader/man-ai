name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intent-test-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Test 1: original 10s timeout"
        id: test_10s
        continue-on-error: true
        run: |
          ./gradlew ciDeviceIsolatedAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.highliuk.manai.IntentImportTest#launchWithActionView_importsMangaAndNavigatesToReader

      - name: "Test 2: extended 60s timeout"
        id: test_60s
        continue-on-error: true
        run: |
          ./gradlew ciDeviceIsolatedAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.highliuk.manai.IntentImportLongTimeoutTest

      - name: "Diagnosis"
        if: always()
        run: |
          echo "10s timeout: ${{ steps.test_10s.outcome }}"
          echo "60s timeout: ${{ steps.test_60s.outcome }}"
          echo ""
          if [[ "${{ steps.test_10s.outcome }}" == "failure" && "${{ steps.test_60s.outcome }}" == "failure" ]]; then
            echo "DIAGNOSIS: Both failed → SharedFlow emission lost (race condition)"
          elif [[ "${{ steps.test_10s.outcome }}" == "failure" && "${{ steps.test_60s.outcome }}" == "success" ]]; then
            echo "DIAGNOSIS: Only 10s failed → device too slow, needs longer timeout"
          elif [[ "${{ steps.test_10s.outcome }}" == "success" && "${{ steps.test_60s.outcome }}" == "success" ]]; then
            echo "DIAGNOSIS: Both passed → test is flaky (non-deterministic)"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-test-results
          path: android/app/build/reports/androidTests/
