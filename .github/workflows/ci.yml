name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run detekt and unit tests
        run: ./gradlew detekt testDebugUnitTest

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models
          key: onnx-models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Download ONNX models
        run: bash "$GITHUB_WORKSPACE/scripts/download-models.sh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache kanji readings CSV
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/kanji_readings.csv
          key: kanji-readings-${{ hashFiles('scripts/generate-kanji-readings.py') }}

      - name: Generate kanji readings CSV
        run: |
          if [ ! -f android/app/src/main/assets/kanji_readings.csv ]; then
            python3 "$GITHUB_WORKSPACE/scripts/generate-kanji-readings.py"
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        run: ./gradlew ciDeviceIsolatedAndroidTest

      - name: Generate coverage report and enforce threshold
        run: ./gradlew jacocoMergedReport jacocoCoverageVerification jacocoPrintCoverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: android/app/build/reports/jacoco/
