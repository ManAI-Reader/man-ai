name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache kanji readings CSV
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/kanji_readings.csv
          key: kanji-readings-${{ hashFiles('scripts/generate-kanji-readings.py') }}

      - name: Generate kanji readings CSV
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/android/app/src/main/assets/kanji_readings.csv" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/generate-kanji-readings.py"
          fi

      - name: Run detekt and unit tests
        run: ./gradlew detekt testDebugUnitTest

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models
          key: onnx-models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Download ONNX models
        run: bash "$GITHUB_WORKSPACE/scripts/download-models.sh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        run: ./gradlew ciDeviceIsolatedAndroidTest

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build release APKs (per-ABI split)
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APKs for release
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            abi=$(echo "$apk" | sed -n 's/app-\(.*\)-release\.apk/\1/p')
            [ -n "$abi" ] && mv "$apk" "man-ai-${version}-${abi}.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
